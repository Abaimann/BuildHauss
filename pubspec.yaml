name: buildhaus
description: "BuildHaus - Built for every ride. Asisten perawatan motor pribadi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.31

  # Networking & File
  dio: ^5.8.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # UI
  intl: ^0.20.2

  # Utils
  google_fonts: ^6.2.1
  crypto: ^3.0.6
  collection: ^1.19.1
  equatable: ^2.0.7
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/parts/
    - assets/icons/
    - assets/catalogs/
    - assets/maintenance_rules/
